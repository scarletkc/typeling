[package]
name = "typeling-tip"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Typeling text service for Windows (TSF): a candidate bar for English typing prediction"

[lib]
name = "typeling_tip"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
strip = true
