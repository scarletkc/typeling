[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "typeling"
version = "0.1.4"
description = "Offline English typing prediction: completes the current word, predicts the next one and fixes typos; a pure-Python n-gram kernel and an optional small language model."
readme = "README.md"
authors = [{ name = "scarletkc" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = []
keywords = ["autocomplete", "word prediction", "next-word prediction", "language model", "kneser-ney", "n-gram",
            "typo correction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
lm = ["torch>=2.7", "transformers>=5"]

[project.urls]
Homepage = "https://github.com/scarletkc/typeling"
Source = "https://github.com/scarletkc/typeling"
Issues = "https://github.com/scarletkc/typeling/issues"

[project.scripts]
typeling = "typeling.demo:main"

[tool.setuptools]
packages = ["typeling"]

[tool.setuptools.package-data]
typeling = ["en.bin"]
