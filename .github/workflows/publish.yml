# Publishes the typeling package to PyPI when a GitHub release is published (tag vX.Y.Z = version in pyproject.toml),
# after building the technical report with the same version and attaching it to the release.
# Uses PyPI trusted publishing: no token is stored; PyPI must list this repository, publish.yml and the environment
# "pypi" as a trusted publisher of the project.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run --no-project --python 3.13 python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Unit tests
        run: uv run --no-project --python 3.13 python -m unittest discover tests
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  report:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install Tectonic 0.17.0
        run: |
          curl -fsSL -o tectonic.tar.gz https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  tectonic.tar.gz" | sha256sum -c -
          tar -xzf tectonic.tar.gz -C "$RUNNER_TEMP"
      - name: Build the technical report
        run: |
          uv run --no-project --python 3.13 paper/version.py
          cd paper && "$RUNNER_TEMP/tectonic" typeling.tex
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp paper/typeling.pdf typeling-technical-report.pdf
          gh release upload "$GITHUB_REF_NAME" typeling-technical-report.pdf --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [build, report]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/typeling
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
